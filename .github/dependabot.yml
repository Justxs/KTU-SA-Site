version: 2
updates:
  - package-ecosystem: npm
    directory: /KTU-SA-WEB
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Vilnius
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
